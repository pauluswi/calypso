services:
  postgres:
    image: postgres:16-alpine
    container_name: calypso-postgres
    environment:
      POSTGRES_USER: calypso
      POSTGRES_PASSWORD: calypso
      POSTGRES_DB: calypso
    ports:
      - "5432:5432"
    volumes:
      - calypso_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calypso -d calypso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  calypso_pg_data:
